name: build

# 不用 paths 过滤：path 过滤和 tag 触发同时存在时会互相吞噬，
# 表现为"打了 tag 却没构建"，而且极难排查。宁可多跑几次。
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    # 固定 22.04 而不是 ubuntu-latest：后者 2026-10 起迁到 Ubuntu 26，
    # 镜像里预装了什么（尤其 Android SDK）不确定。构建机不该随镜像漂移。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 【2026-11-13 修】原来用 android-actions/setup-android@v3，它自己在第 8 秒就挂了
      # （Node20→24 强制迁移 + 它内部下载 cmdline-tools 的问题），根本没走到编译。
      # 现在直接改用 runner 镜像自带的 Android SDK（ubuntu-latest 预装了，licenses 也已接受），
      # 少一个第三方 action 就少一处会坏的地方。
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses" || true

      # 兜底装一次 platform 34；失败也不中断（AGP 自己也会去下，镜像里 licenses 已接受）。
      # 这一步是保险，不是主路径 —— 所以 `|| echo` 而不是 `set -e`。
      - name: Ensure platform 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$MGR" ]; then
            "$MGR" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 \
              || echo "sdkmanager 装包失败，交给 AGP 自己处理"
          else
            echo "镜像里没有 sdkmanager，交给 AGP 自己处理"
          fi

      # Gradle 也不用第三方 action：直接下发行包，版本确定、行为可预期。
      - name: Install Gradle 8.2
        run: |
          set -euo pipefail
          curl -sSL --retry 3 https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.2/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-dist/gradle-8.2/bin/gradle" --version

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller onedir)
        run: pyinstaller --noconfirm packaging/jobpilot.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { Write-Host "::error::找不到 ISCC.exe"; exit 1 }
          Write-Host "ISCC = $iscc"
          Write-Host "--- dist/jobpilot 前 5 项 ---"
          Get-ChildItem "dist\jobpilot" -ErrorAction SilentlyContinue | Select-Object -First 5 Name
          & $iscc "packaging\inno\jobpilot.iss"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ISCC 退出码 $LASTEXITCODE（报错行就在上面）"; exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    # 【2026-11-13 修】原来 needs 两个都成功才跑 —— Windows 一挂，APK 就永远进不了 Release。
    # 现在只要 Android 成功就发；always() 是为了绕开"有依赖失败就整段跳过"的规则。
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what we have
        run: find dist -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.apk
            dist/**/*.exe
          generate_release_notes: true
