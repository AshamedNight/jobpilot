# 招呼文案池（闭环 1 · 节奏引擎）
#
# 为什么有这个文件：真机数据里 11 条招呼在 77 秒内发完、且**一字不差**，
# 这是平台行为风控最先识别的特征。文案池是"不像机器人"的第一道拆解。
#
# 硬约束（`app/core/greet_pool.py` 启动时校验，命中即 StartupError，不静默降级）：
#   1. 模板数 ≥ MIN_TEMPLATES(20)：少于 20 条等于没做，直接拒绝启动
#   2. 渲染后长度 ≤ max_chars(60)：与 BOSS 打招呼输入框的口径一致
#   3. 禁止编造量化资历：正则 `\d+\s*(年|起|件|单|万|%)` 一律拒绝
#      （"3 年经验 / 500 起案件 / 胜诉率 90%" 这类是简历造假，也是平台审核重点）
#   4. 禁止硬编码的资格词：执业证号 / 通过率 / 客户名称
#
# 变量：{title} 岗位名、{company} 公司名。缺值自动填"这个岗位" / "贵司"，不留空格。
# 选择规则见 greet_pool.pick()：先按 match_words 分组，组内 sha256(job_id) 定位，
# 同一岗位永远同一句（重试不会换文案），同轮已用过的句子顺延到下一条。

version: 1
max_chars: 60

templates:
  # ---- 通用（match_words 为空，任何岗位可用；至少 5 条，保证无命中时也有变体）----
  - id: g_01
    match_words: []
    text: "您好，看到{company}在招{title}，想了解下日常工作主要覆盖哪块？"
  - id: g_02
    match_words: []
    text: "您好，关注到贵司{title}这个岗位，方便说说团队目前的配置吗？"
  - id: g_03
    match_words: []
    text: "您好，{title}这个岗位还在招吗？想请教一下主要的工作重心。"
  - id: g_04
    match_words: []
    text: "您好，看到{company}招{title}，我对这个方向有兴趣，想先了解下岗位情况。"
  - id: g_05
    match_words: []
    text: "您好，投递前想问一下{title}的用人节奏，您这边方便简单说下吗？"
  - id: g_06
    match_words: []
    text: "您好，{title}这个岗位还开放吗？我这边可以随时沟通。"
  - id: g_07
    match_words: []
    text: "您好，看到{company}的{title}，想请教下入职后前三个月的主要目标。"
  - id: g_08
    match_words: []
    text: "您好，对{title}比较感兴趣，想先了解下岗位职责的边界。"
  - id: g_09
    match_words: []
    text: "您好，{company}这个{title}岗位，想问问是否需要兼顾其他模块？"
  - id: g_10
    match_words: []
    text: "您好，看到贵司招{title}，方便的话想了解下业务线和汇报关系。"

  # ---- 合同 / 合规 / 风控 ----
  - id: c_01
    match_words: ["合同", "合规", "风控", "审核"]
    text: "您好，看到{title}，我主要做合同审核和合规这块，想了解下贵司的业务侧重。"
  - id: c_02
    match_words: ["合同", "合规", "风控", "审核"]
    text: "您好，{company}的{title}还在招吗？我做过合同与合规的日常支撑，想聊聊具体分工。"
  - id: c_03
    match_words: ["合同", "合规", "风控", "审核"]
    text: "您好，想请教下{title}这边，合同审查的量和业务线是怎么分布的？"

  # ---- 诉讼 / 争议解决 ----
  - id: l_01
    match_words: ["诉讼", "争议", "仲裁", "纠纷"]
    text: "您好，看到贵司招{title}，想了解下诉讼这块是内部出庭还是外聘为主？"
  - id: l_02
    match_words: ["诉讼", "争议", "仲裁", "纠纷"]
    text: "您好，{title}这个岗位，想请教一下争议解决的工作量占比。"
  - id: l_03
    match_words: ["诉讼", "争议", "仲裁", "纠纷"]
    text: "您好，看到{company}的{title}，想了解下贵司常涉的纠纷类型主要是哪几类？"

  # ---- 债务 / 不良资产 ----
  - id: d_01
    match_words: ["债务", "不良", "清收", "催收"]
    text: "您好，看到{company}在招{title}，想了解下不良资产的处置流程怎么分工？"
  - id: d_02
    match_words: ["债务", "不良", "清收", "催收"]
    text: "您好，{title}这边主要是做前端谈判还是后端流程跟进？想先了解下。"

  # ---- 知识产权 ----
  - id: i_01
    match_words: ["知识产权", "商标", "专利", "版权"]
    text: "您好，{title}这边主要涉及商标还是专利方向？想先了解下再投递。"
  - id: i_02
    match_words: ["知识产权", "商标", "专利", "版权"]
    text: "您好，看到{company}招{title}，想请教下知识产权这块是自办还是委托代理所？"

  # ---- 劳动 / 人事 ----
  - id: h_01
    match_words: ["劳动", "人事", "员工关系"]
    text: "您好，看到贵司{title}，想了解下劳动关系这块是独立负责还是配合人力？"
  - id: h_02
    match_words: ["劳动", "人事", "员工关系"]
    text: "您好，{title}这个岗位，想请教下日常更偏制度搭建还是个案处理？"

  # ---- 兜底补充（表达型，不提问，让文案池的"语气"也有变化）----
  - id: s_01
    match_words: []
    text: "您好，看到{company}在招{title}，我一直在做法务相关工作，想进一步了解岗位。"
  - id: s_02
    match_words: []
    text: "您好，这个{title}岗位看着比较匹配，方便的话想和您聊聊。"
  - id: s_03
    match_words: []
    text: "您好，看到贵司在招{title}，我做过企业法务的日常事务，想和您聊聊。"
